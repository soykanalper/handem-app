<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Hande'M — İş ve Finans Takip</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hande'M">
<meta name="theme-color" content="#8B5CF6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- branded splash screen (§74-76), shown until first route finishes rendering -->
<div id="splash" class="splash">
  <img src="icons/logo.png" alt="Hande'M" class="splash-logo">
</div>

<!-- cloud login screen — only ever populated/shown when Firebase is
     configured and no session is active yet, see js/cloud/bootstrap.js -->
<div id="authScreen" class="auth-screen" style="display:none;"></div>

<div id="app">
  <header class="topbar" id="topbar"></header>
  <main class="content" id="content"></main>
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn" data-nav="home">
      <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg></span>
      <span>Ana Sayfa</span>
    </button>
    <button class="nav-btn" data-nav="customers">
      <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.2 20c0-3.1 2.6-5.3 5.8-5.3s5.8 2.2 5.8 5.3"/><circle cx="17.3" cy="9.2" r="2.4"/><path d="M15.6 15.1c2.5.5 4.2 2.3 4.2 4.9"/></svg></span>
      <span>Müşteriler</span>
    </button>
    <button class="fab" id="fabBtn" title="Ekle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="nav-btn" data-nav="mecra">
      <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M8 21h8M12 18v3"/></svg></span>
      <span>Mecralar</span>
    </button>
    <button class="nav-btn" data-nav="finance">
      <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.3"/><path d="M2.5 10h19"/><path d="M6 14.3h4.2"/></svg></span>
      <span>Finans</span>
    </button>
  </nav>
</div>

<!-- generic bottom-sheet overlay stack -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<!-- fullscreen photo lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<!-- toast -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- due-date alert banner -->
<div class="alert-banner" id="alertBanner"></div>

<!-- hidden file inputs for photo capture -->
<input type="file" accept="image/*" capture="environment" id="cameraInput" style="display:none">
<input type="file" accept="image/*" id="galleryInput" style="display:none">

<script type="module" src="js/app.js"></script>
</body>
</html>
